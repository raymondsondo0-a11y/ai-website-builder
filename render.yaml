services:
  - type: web
    name: raymond-ai-command-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: raymondsondo0-a11y/ai-website-builder
      - key: GITHUB_BRANCH
        value: main
      - key: MOMO_API_TOKEN
        sync: false
      - key: MOMO_SENDER_ID
        sync: false
      - key: MOMO_WEBHOOK_SECRET
        sync: false
      - key: MOMO_SEND_URL
        value: https://business.momo.tz/api/v3/whatsapp/send
